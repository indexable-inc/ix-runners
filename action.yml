name: ix runner pool reconcile
description: >
  Converge a self-hosted ix runner pool to this repository's runner config:
  create missing members, repair offline ones, replace stale or dead ones.
  Run on GITHUB-HOSTED runners only - a runner VM must never see IX_TOKEN.

inputs:
  ix-token:
    description: ix API token the runner VMs bill to
    required: true
  runner-pat:
    description: >
      Fine-grained PAT, Administration rw on this repo. Never leaves the
      hosted runner: it mints short-lived (1 h) registration tokens and
      reads runner status; VMs only ever receive a registration token.
    required: true
  region:
    description: ix region the pool lives in
    default: us-west-1
  pool-size:
    description: Number of pool VMs (must match the flake's mkPool size)
    default: "8"
  max-replacements:
    description: >
      Per-run cap on creations+replacements. A bad config rev stalls loudly
      after N boots instead of thrashing the pool; a config roll converges
      across runs like a rolling update. Raise for first bootstrap.
    default: "2"
  concurrency:
    description: >
      Creations/replacements executed at once. Guest boots dominate a
      roll's wall clock and overlap safely; each concurrent first boot of a
      new rev is also a concurrent template build, so keep this within the
      region's build appetite.
    default: "4"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Reconcile runner pool
      shell: bash
      env:
        IX_TOKEN: ${{ inputs.ix-token }}
        RUNNER_PAT: ${{ inputs.runner-pat }}
        IX_REGION: ${{ inputs.region }}
        POOL_SIZE: ${{ inputs.pool-size }}
        MAX_REPLACEMENTS: ${{ inputs.max-replacements }}
        CONCURRENCY: ${{ inputs.concurrency }}
      run: ${{ github.action_path }}/reconcile/ix-runners
