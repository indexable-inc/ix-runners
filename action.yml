name: ix runner pool reconcile
description: >
  Converge a self-hosted ix runner pool to this repository's runner config:
  create missing members, repair offline ones, replace stale or dead ones,
  and switch members on and off to follow the job queue.
  Run on GITHUB-HOSTED runners only - a runner VM must never see IX_TOKEN.

# Every input below defaults to empty on purpose: the reconcile script owns
# the default values, so they cannot drift between here and there. The value
# each one falls back to is named in its description.
inputs:
  ix-token:
    description: ix API token the runner VMs bill to
    required: true
  runner-pat:
    description: >
      Fine-grained PAT, Administration rw on this repo. Never leaves the
      hosted runner: it mints short-lived (1 h) registration tokens and
      reads runner status; VMs only ever receive a registration token.
    required: true
  region:
    description: ix region the pool lives in (default us-west-1)
    default: ""
  pool-name:
    description: >
      Pool name; everything derives from it (VM names <pool>-runner-<N>,
      runner names <pool>-r<N>-<slot>, the secret key). MUST equal the
      `services.ix-runner.poolName` in your nix policy. Defaults to this
      repository's name.
    default: ""
  attr-prefix:
    description: >
      Flake attribute prefix for pool members, `<prefix>-<N>`. Must equal
      mkPool's attrPrefix (default ci-runner).
    default: ""
  pool-size:
    description: >
      Number of pool VMs; must match the flake's mkPool size (default 8).
      Lowering it prunes the members above the new size.
    default: ""
  max-replacements:
    description: >
      Per-run cap on creations+replacements (default 2). A bad config rev
      stalls loudly after N boots instead of thrashing the pool; a config
      roll converges across runs like a rolling update. An empty pool
      raises the cap to pool-size on its own.
    default: ""
  concurrency:
    description: >
      Creations/replacements executed at once (default 4). Guest boots
      dominate a roll's wall clock and overlap safely; each concurrent
      first boot of a new rev is also a concurrent template build, so keep
      this within the region's build appetite.
    default: ""

  # -- autoscaling: the pool's member set stays fixed, only power moves --
  min-warm:
    description: >
      Members kept ON no matter how quiet it is - the floor that decides
      how much of a wave starts instantly instead of waiting for a boot.
      Defaults to pool-size, which is autoscaling OFF and exactly the
      pre-autoscaling behaviour; set it lower to turn scaling on.
    default: ""
  max-online:
    description: >
      Ceiling on members powered on at once (default pool-size).
    default: ""
  scale-headroom:
    description: >
      Members kept on ABOVE current demand, so the next job finds a warm
      runner rather than a boot (default 2).
    default: ""
  runner-label:
    description: >
      The label your jobs target, e.g. the first of
      `services.ix-runner.labels`. This is the demand signal: jobs queued or
      running against it are what the pool is sized to. REQUIRED once
      min-warm is below max-online - without it every wave would read as
      zero jobs.
    default: ""
  idle-grace-ticks:
    description: >
      Consecutive reconciles a member must be seen idle before it is
      switched off (default 1, meaning the first idle scan is enough). The
      count lives on the VM, so it survives across runs; raise it if your
      jobs arrive in closely-spaced bursts.
    default: ""
  max-power-actions:
    description: >
      Per-run cap on starts+stops (default 8). The same idea as
      max-replacements: a wrong scaling decision converges slowly instead
      of moving the whole fleet at once.
    default: ""
  github-token:
    description: >
      Token used ONLY to read the job queue for the demand signal. The
      workflow's own GITHUB_TOKEN, which needs `permissions: actions: read`.
      Deliberately not the PAT: listing runs needs the Actions permission,
      and repo administration has no business holding it.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install uv
      # Pinned by commit: this job holds both secrets, so a mutable tag here
      # is a supply-chain hole straight into IX_TOKEN and RUNNER_PAT.
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        # setup-uv turns the Actions cache on by itself on hosted runners, and
        # uv verifies a wheel's hash when it DOWNLOADS it, not on a cache hit.
        # The Actions cache is writable by any job in the repo, including one
        # running on a pool VM: a poisoned entry restored here would execute
        # in the job holding IX_TOKEN and a repo-admin PAT, hash-pinned lock
        # or not. One 3.8 MB wheel with no transitive dependencies - the cache
        # buys nothing worth that.
        enable-cache: false

    - name: Reconcile runner pool
      shell: bash
      env:
        IX_TOKEN: ${{ inputs.ix-token }}
        RUNNER_PAT: ${{ inputs.runner-pat }}
        IX_REGION: ${{ inputs.region }}
        POOL_NAME: ${{ inputs.pool-name }}
        ATTR_PREFIX: ${{ inputs.attr-prefix }}
        POOL_SIZE: ${{ inputs.pool-size }}
        MAX_REPLACEMENTS: ${{ inputs.max-replacements }}
        CONCURRENCY: ${{ inputs.concurrency }}
        MIN_WARM: ${{ inputs.min-warm }}
        MAX_ONLINE: ${{ inputs.max-online }}
        SCALE_HEADROOM: ${{ inputs.scale-headroom }}
        RUNNER_LABEL: ${{ inputs.runner-label }}
        IDLE_GRACE_TICKS: ${{ inputs.idle-grace-ticks }}
        MAX_POWER_ACTIONS: ${{ inputs.max-power-actions }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      # --locked: install exactly the hash-pinned ix-sdk in ix-runners.lock,
      # never whatever the index resolves to today.
      run: uv run --locked --script "${{ github.action_path }}/reconcile/ix-runners"
