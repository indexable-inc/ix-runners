name: ix runner reconcile
description: >
  Converge this repository's ephemeral ix runner fleet to its job queue:
  spawn a machine per demanded job (forked from the lineage's last-green
  seed), promote green default-branch runs into fresh seeds, and delete
  what is finished. Run on GITHUB-HOSTED runners only - a runner VM must
  never see IX_TOKEN. Run SINGLE-FLIGHT (a `concurrency` group, as in the
  README's workflow): two overlapping ticks can double-spawn and
  double-promote - nothing in the reconcile itself takes a lock.

# One secret, one credential choice, one optional path. Every dial - the
# pool name, caps, grace periods - lives in the spec file, which is the one
# place the fleet's shape is stated. The spec comes from `config-file` (a
# pool your repository defines) or `pool` (one THIS repository ships under
# pools/<name>); with neither set, the default spec path applies as before.
inputs:
  ix-token:
    description: ix API token the runner VMs bill to
    required: true

  # -- how this authenticates to GitHub to administer runners --
  # NOT with a GitHub App private key. An App's key is APP-GLOBAL: it mints
  # installation tokens for EVERY installation of that App, so putting one in
  # a repo hands that repo the keys to every other fleet the App serves.
  # There is no version of that which is safe to ask a customer to do, so
  # the action never accepts one.
  token-source:
    description: >
      Where the GitHub credential comes from.

      "pat" (the default) uses the admin PAT in `runner-pat`.

      "ix" trades this run's OIDC identity for a short-lived installation
      token scoped to THIS repository: no standing admin secret anywhere.
      Needs the ix-runners GitHub App installed on the repo and
      `permissions: id-token: write` on the reconcile job.
    default: pat

  runner-pat:
    description: >
      Fine-grained PAT with Administration read/write on this repo. Required
      when token-source is "pat". A PAT is bound to a person, outlives them
      on the repo, and carries whatever else they granted it - which is why
      it is the fallback and not the destination.
    default: ""

  pool:
    description: >
      Name of a pool this repository ships under pools/<name>/ (its
      ix-runners.toml spec, runner policy, and template flake). The pool's
      whole definition then travels with the action: cold-boot templates
      pin THIS repository at the action's own commit, so seeds re-key -
      and the fleet re-seeds - exactly when the `uses:` pin changes, and a
      merge in your repository never can. Requires the action to be pinned
      by full commit sha. Ignored when config-file is set; your repository
      then needs no checkout step at all.
    default: ""

  config-file:
    description: >
      Path to the pool spec, relative to the workspace. Takes precedence
      over `pool`.
    default: ""

  github-token:
    description: >
      Reads the job queue for the demand signal, and nothing else. The
      workflow's own GITHUB_TOKEN, which needs `permissions: actions: read`.
      Deliberately not the PAT: listing runs needs the Actions permission,
      and repo administration has no business holding it. You should not
      need to set this.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install bun
      # Pinned by commit: this job holds both secrets, so a mutable tag here
      # is a supply-chain hole straight into IX_TOKEN and RUNNER_PAT.
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.3.13"

    - name: Reconcile the runner fleet
      shell: bash
      env:
        IX_TOKEN: ${{ inputs.ix-token }}
        IX_TOKEN_SOURCE: ${{ inputs.token-source }}
        GITHUB_ADMIN_TOKEN: ${{ inputs.runner-pat }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_POOL: ${{ inputs.pool }}
        # The ref this action was invoked at (the sha in `uses:` when pinned
        # by commit) and the repository it lives in. Forwarded to the
        # reconcile only in `pool` mode, where the templates must pin the
        # action's own repo at this exact rev.
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
      # --frozen-lockfile: install exactly the hash-pinned dependency set in
      # bun.lock, never whatever the registry resolves to today.
      run: |
        cd "${{ github.action_path }}"
        bun install --frozen-lockfile --production
        cd "$GITHUB_WORKSPACE"
        if [ -n "$INPUT_CONFIG_FILE" ]; then
          # A pool your repository defines: the spec comes from the
          # workspace checkout, as it always has.
          export IX_POOL_SPEC="$INPUT_CONFIG_FILE"
        elif [ -n "$INPUT_POOL" ]; then
          # A pool this repository ships: spec and template come from the
          # action's own checkout, and the re-seed trigger is the pin.
          export IX_POOL_SPEC="$GITHUB_ACTION_PATH/pools/$INPUT_POOL/ix-runners.toml"
          export IX_RUNNERS_ACTION_REV="$ACTION_REF"
          export IX_RUNNERS_ACTION_REPO="$ACTION_REPO"
        else
          export IX_POOL_SPEC=".github/ix-runners.toml"
        fi
        bun run "${{ github.action_path }}/src/main.ts"
