name: ix runner reconcile
description: >
  Converge this repository's ephemeral ix runner fleet to its job queue:
  spawn a machine per demanded job (forked from the lineage's last-green
  seed), promote green default-branch runs into fresh seeds, and delete
  what is finished. Run on GITHUB-HOSTED runners only - a runner VM must
  never see IX_TOKEN. Run SINGLE-FLIGHT (a `concurrency` group, as in the
  README's workflow): two overlapping ticks can double-spawn and
  double-promote - nothing in the reconcile itself takes a lock.

# One secret, one credential choice, one optional path. Every dial - the
# pool name, caps, grace periods - lives in the spec file, which is the one
# place the fleet's shape is stated.
inputs:
  ix-token:
    description: ix API token the runner VMs bill to
    required: true

  # -- how this authenticates to GitHub to administer runners --
  # NOT with a GitHub App private key. An App's key is APP-GLOBAL: it mints
  # installation tokens for EVERY installation of that App, so putting one in
  # a repo hands that repo the keys to every other fleet the App serves.
  # There is no version of that which is safe to ask a customer to do, so
  # the action never accepts one.
  token-source:
    description: >
      Where the GitHub credential comes from.

      "pat" (the default) uses the admin PAT in `runner-pat`.

      "ix" trades this run's OIDC identity for a short-lived installation
      token scoped to THIS repository. Not available yet from this action's
      TypeScript SDK; the input exists so workflows can be written against
      the destination while it ships.
    default: pat

  runner-pat:
    description: >
      Fine-grained PAT with Administration read/write on this repo. Required
      when token-source is "pat". A PAT is bound to a person, outlives them
      on the repo, and carries whatever else they granted it - which is why
      it is the fallback and not the destination.
    default: ""

  config-file:
    description: >
      Path to the pool spec, relative to the workspace.
    default: .github/ix-runners.toml

  github-token:
    description: >
      Reads the job queue for the demand signal, and nothing else. The
      workflow's own GITHUB_TOKEN, which needs `permissions: actions: read`.
      Deliberately not the PAT: listing runs needs the Actions permission,
      and repo administration has no business holding it. You should not
      need to set this.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install bun
      # Pinned by commit: this job holds both secrets, so a mutable tag here
      # is a supply-chain hole straight into IX_TOKEN and RUNNER_PAT.
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.3.13"

    - name: Reconcile the runner fleet
      shell: bash
      env:
        IX_TOKEN: ${{ inputs.ix-token }}
        IX_TOKEN_SOURCE: ${{ inputs.token-source }}
        GITHUB_ADMIN_TOKEN: ${{ inputs.runner-pat }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        IX_POOL_SPEC: ${{ inputs.config-file }}
      # --frozen-lockfile: install exactly the hash-pinned dependency set in
      # bun.lock, never whatever the registry resolves to today.
      run: |
        cd "${{ github.action_path }}"
        bun install --frozen-lockfile --production
        cd "$GITHUB_WORKSPACE"
        bun run "${{ github.action_path }}/src/main.ts"
