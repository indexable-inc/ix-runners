name: ix runner pool reconcile
description: >
  Converge a self-hosted ix runner pool to this repository's pool spec:
  create missing members, repair offline ones, replace stale or dead ones,
  and switch members on and off to follow the job queue.
  Run on GITHUB-HOSTED runners only - a runner VM must never see IX_TOKEN.

# Two secrets and a path. Everything else about the pool - its name, size,
# region, and every autoscaling dial - lives in the spec file, which the
# flake reads too. There is deliberately no way to set a pool's size here:
# doing that once meant the workflow and the flake could disagree, and the
# only symptom was every run going red until somebody spotted it.
inputs:
  ix-token:
    description: ix API token the runner VMs bill to
    required: true

  # -- how this authenticates to GitHub to administer runners --
  # NOT with a GitHub App private key. An App's key is APP-GLOBAL: it mints
  # installation tokens for EVERY installation of that App, so putting one in
  # a repo hands that repo the keys to every other pool the App serves. There
  # is no version of that which is safe to ask a customer to do, so the
  # action never accepts one.
  token-source:
    description: >
      Where the GitHub credential comes from.

      "ix" asks the ix API to vend a short-lived installation token for THIS
      repository, proving which repository is asking with the runner's OIDC
      identity. Nothing is stored: the calling workflow needs
      `permissions: id-token: write`, and the repo needs the ix-runners App
      installed (https://github.com/apps/ix-runners).

      "pat" uses the admin PAT in `runner-pat`. The default today, because
      the vending endpoint is not deployed yet; the default flips to "ix"
      once it is.
    default: pat

  runner-pat:
    description: >
      Fine-grained PAT with Administration read/write on this repo. Required
      when token-source is "pat", refused when it is "ix". A PAT is bound to
      a person, outlives them on the repo, and carries whatever else they
      granted it - which is why it is the fallback and not the destination.
    default: ""
  ix-api:
    description: >
      Base URL of the ix API that vends the GitHub token. You should not
      need to set this.
    default: https://ix.dev
  config-file:
    description: >
      Path to the pool spec, relative to the workspace. Defaults to
      nix/ix-pool.toml, which is where the flake looks for it too.
    default: nix/ix-pool.toml
  github-token:
    description: >
      Reads the job queue for the demand signal, and nothing else. The
      workflow's own GITHUB_TOKEN, which needs `permissions: actions: read`.
      Deliberately not the PAT: listing runs needs the Actions permission,
      and repo administration has no business holding it. You should not
      need to set this.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Fail before anything is created, naming the fix, rather than letting
    # the reconcile die on a missing environment variable mid-run.
    - name: Check the token source
      shell: bash
      env:
        SOURCE: ${{ inputs.token-source }}
        PAT: ${{ inputs.runner-pat }}
      run: |
        case "$SOURCE" in
          ix)
            if [ -n "$PAT" ]; then
              echo "::error::token-source is \"ix\" but runner-pat is also set." \
                   "Remove the runner-pat input; leaving it wired means a PAT" \
                   "nobody reads is still in this repo's secrets." >&2
              exit 1
            fi
            if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
              echo "::error::token-source is \"ix\" but this job cannot request an" \
                   "OIDC token. Add 'permissions: id-token: write' to the job (or" \
                   "the workflow) - it is how ix knows which repository is asking." >&2
              exit 1
            fi
            ;;
          pat)
            if [ -z "$PAT" ]; then
              echo "::error::token-source is \"pat\" but runner-pat is empty." \
                   "Set it, or switch to token-source: ix." >&2
              exit 1
            fi
            ;;
          *)
            echo "::error::token-source must be \"ix\" or \"pat\", got \"$SOURCE\"." >&2
            exit 1
            ;;
        esac

    - name: Vend a GitHub token from ix
      id: vend
      if: inputs.token-source == 'ix'
      shell: bash
      env:
        IX_TOKEN: ${{ inputs.ix-token }}
        IX_API: ${{ inputs.ix-api }}
      # curl and python3 only - both preinstalled on hosted runners. This job
      # holds IX_TOKEN and is about to hold a repo-admin credential; it is not
      # the place to install anything.
      run: |
        set -euo pipefail

        # The runner's own identity, as a JWT GitHub signs. ix verifies it and
        # reads the repository out of it, which is what makes this safe: the
        # caller cannot ask for a token for a repository it is not running in.
        claim=$(curl -sS --fail-with-body \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ix.dev")
        oidc=$(printf '%s' "$claim" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
        echo "::add-mask::$oidc"

        # -o/-w so a non-2xx body can be read for the diagnosis below rather
        # than being thrown away by --fail.
        body=$(mktemp)
        code=$(printf '%s' "{\"oidc_token\":\"$oidc\"}" | curl -sS -o "$body" -w '%{http_code}' \
          -X POST "$IX_API/api/ci/github-token" \
          -H "Authorization: Bearer $IX_TOKEN" \
          -H "Content-Type: application/json" \
          --data-binary @-)

        case "$code" in
          200) ;;
          401) echo "::error::ix rejected IX_TOKEN (401). The secret is wrong," \
                    "expired, or belongs to another account." >&2; exit 1 ;;
          403) echo "::error::ix rejected the OIDC token (403). Either the job is" \
                    "missing 'permissions: id-token: write', or the audience is not" \
                    "ix.dev, or the token expired before it was used." >&2; exit 1 ;;
          404) echo "::error::the ix-runners GitHub App is not installed on this" \
                    "repository (404). Install it:" \
                    "https://github.com/apps/ix-runners" >&2; exit 1 ;;
          429) echo "::error::ix is rate limiting token vending (429). This run does" \
                    "nothing; the next tick reconciles." >&2; exit 1 ;;
          *)   echo "::error::ix token vending failed with HTTP $code." >&2; exit 1 ;;
        esac

        token=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["token"])' "$body")
        expires=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("expires_at","?"))' "$body")
        rm -f "$body"
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"
        echo "vended a GitHub token for this repository, expiring $expires"

    - name: Install uv
      # Pinned by commit: this job holds both secrets, so a mutable tag here
      # is a supply-chain hole straight into IX_TOKEN and RUNNER_PAT.
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        # setup-uv turns the Actions cache on by itself on hosted runners, and
        # uv verifies a wheel's hash when it DOWNLOADS it, not on a cache hit.
        # The Actions cache is writable by any job in the repo, including one
        # running on a pool VM: a poisoned entry restored here would execute
        # in the job holding IX_TOKEN and a repo-admin PAT, hash-pinned lock
        # or not. One 3.8 MB wheel with no transitive dependencies - the cache
        # buys nothing worth that.
        enable-cache: false

    - name: Reconcile runner pool
      shell: bash
      env:
        IX_TOKEN: ${{ inputs.ix-token }}
        # The vended token when there is one, else the PAT. The reconcile
        # does not care which: an installation token is a bearer token in the
        # same header, and every endpoint it calls accepts both.
        GITHUB_ADMIN_TOKEN: ${{ steps.vend.outputs.token || inputs.runner-pat }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        IX_POOL_SPEC: ${{ inputs.config-file }}
      # --locked: install exactly the hash-pinned ix-sdk in ix-runners.lock,
      # never whatever the index resolves to today.
      run: uv run --locked --script "${{ github.action_path }}/reconcile/ix-runners"
