name: ix runner pool reconcile
description: >
  Converge a self-hosted ix runner pool to this repository's pool spec:
  create missing members, repair offline ones, replace stale or dead ones,
  and switch members on and off to follow the job queue.
  Run on GITHUB-HOSTED runners only - a runner VM must never see IX_TOKEN.

# Two secrets and a path. Everything else about the pool - its name, size,
# region, and every autoscaling dial - lives in the spec file, which the
# flake reads too. There is deliberately no way to set a pool's size here:
# doing that once meant the workflow and the flake could disagree, and the
# only symptom was every run going red until somebody spotted it.
inputs:
  ix-token:
    description: ix API token the runner VMs bill to
    required: true

  # -- how this authenticates to GitHub to administer runners --
  # A GitHub App, not a person. The installation token it mints is scoped to
  # the installation, expires in an hour, and dies with the installation
  # rather than with somebody's account.
  github-app-id:
    description: >
      App ID of a GitHub App installed on this repo with Administration
      read/write and Actions read. Not a secret - a repository variable is
      the right home for it.
    default: ""
  github-app-private-key:
    description: >
      The App's private key (PEM). Never leaves the hosted runner: it is
      exchanged for a 1-hour installation token that mints registration
      tokens and reads runner status. A VM only ever receives a
      registration token, which can do nothing but register a runner.
    default: ""

  runner-pat:
    description: >
      DEPRECATED, accepted for one release. Fine-grained PAT with
      Administration rw on this repo, used when the App inputs are absent.
      A PAT is bound to a person, outlives them on the repo, and carries
      whatever else they granted it; the App path exists to end all three.
      Migrate to github-app-id + github-app-private-key.
    default: ""
  config-file:
    description: >
      Path to the pool spec, relative to the workspace. Defaults to
      nix/ix-pool.toml, which is where the flake looks for it too.
    default: nix/ix-pool.toml
  github-token:
    description: >
      Reads the job queue for the demand signal, and nothing else. The
      workflow's own GITHUB_TOKEN, which needs `permissions: actions: read`.
      Deliberately not the PAT: listing runs needs the Actions permission,
      and repo administration has no business holding it. You should not
      need to set this.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Fail before anything is created, and name both paths, rather than
    # letting the reconcile die on a missing environment variable.
    - name: Check the admin credential
      shell: bash
      env:
        APP_ID: ${{ inputs.github-app-id }}
        APP_KEY: ${{ inputs.github-app-private-key }}
        PAT: ${{ inputs.runner-pat }}
      run: |
        if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
          exit 0
        fi
        if [ -n "$APP_ID" ] || [ -n "$APP_KEY" ]; then
          echo "::error::github-app-id and github-app-private-key must be set together." >&2
          exit 1
        fi
        if [ -n "$PAT" ]; then
          echo "::warning::runner-pat is deprecated and will be removed in a" \
               "future release. Create a GitHub App with Administration" \
               "read/write and Actions read, then set github-app-id and" \
               "github-app-private-key instead."
          exit 0
        fi
        echo "::error::no admin credential: set github-app-id +" \
             "github-app-private-key (preferred), or runner-pat." >&2
        exit 1

    - name: Mint an App installation token
      id: app-token
      if: inputs.github-app-id != ''
      # Pinned by commit: this step turns a private key into a token with
      # Administration rw on the repo, so a mutable tag here is a
      # supply-chain hole into repo takeover. The action revokes the token in
      # its own post step, so it never outlives this job.
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.github-app-id }}
        private-key: ${{ inputs.github-app-private-key }}

    - name: Install uv
      # Pinned by commit: this job holds both secrets, so a mutable tag here
      # is a supply-chain hole straight into IX_TOKEN and RUNNER_PAT.
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        # setup-uv turns the Actions cache on by itself on hosted runners, and
        # uv verifies a wheel's hash when it DOWNLOADS it, not on a cache hit.
        # The Actions cache is writable by any job in the repo, including one
        # running on a pool VM: a poisoned entry restored here would execute
        # in the job holding IX_TOKEN and a repo-admin PAT, hash-pinned lock
        # or not. One 3.8 MB wheel with no transitive dependencies - the cache
        # buys nothing worth that.
        enable-cache: false

    - name: Reconcile runner pool
      shell: bash
      env:
        IX_TOKEN: ${{ inputs.ix-token }}
        # The App token when there is one, else the deprecated PAT. The
        # reconcile does not care which: an installation token is a bearer
        # token, and every endpoint it calls accepts both.
        GITHUB_ADMIN_TOKEN: ${{ steps.app-token.outputs.token || inputs.runner-pat }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        IX_POOL_SPEC: ${{ inputs.config-file }}
      # --locked: install exactly the hash-pinned ix-sdk in ix-runners.lock,
      # never whatever the index resolves to today.
      run: uv run --locked --script "${{ github.action_path }}/reconcile/ix-runners"
