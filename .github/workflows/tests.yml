name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      # The suite exercises code that prints real ::error::/::warning::
      # workflow commands - without stop-commands the runner would turn
      # expected test output into annotations on every commit. The token is
      # random so no printed line can resume command processing early; these
      # are the last steps, so not resuming on a failed run costs nothing.
      - run: |
          token="stop-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$token"
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun test
          echo "::$token::"
