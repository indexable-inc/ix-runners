name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # The reconcile's fakes stand in for the SDK, so the suite needs no
      # dependencies at all - only a Python. A discover that reaches nothing
      # exits 5, so a silently empty run cannot pass here.
      - run: uv run --no-project python -m unittest discover -s . -v
