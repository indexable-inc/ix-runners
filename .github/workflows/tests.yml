name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # The suite installs nothing (no pyproject/lock to key on), so the
          # cache would never invalidate - setup-uv warns about exactly that.
          enable-cache: false

      # The reconcile's fakes stand in for the SDK, so the suite needs no
      # dependencies at all - only a Python. A discover that reaches nothing
      # exits 5, so a silently empty run cannot pass here.
      #
      # The suite drives report.log_error/log_warning through failure paths,
      # and those print real ::error::/::warning:: workflow commands - without
      # stop-commands the runner turns expected test output into annotations
      # on every commit. The token is random so no printed line can resume
      # command processing early; this is the last step, so not resuming on a
      # failed run costs nothing.
      - run: |
          token="stop-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$token"
          uv run --no-project python -m unittest discover -s . -v
          echo "::$token::"
