# BAML's runner fleet. Read by the reconcile when the customer workflow
# says `pool: baml` on the action. Every key is optional with a working
# default, except `image`; an unknown key is an error, not a default.

# Fleet identity: machine names are <pool-name>-run-<lineage>-<nonce> and
# <pool-name>-seed-<lineage>-<rev>; the reconcile matches on those, so
# renaming this orphans every seed.       (default: the repository's name)
pool-name = "baml"

# The OCI image every cold-booted runner of this pool starts from: a
# version tag of the platform's default runner image (registry.ix.dev,
# published weekly by .github/workflows/publish-default-images.yml in the ix
# repository). Tags never move, so the reference names the runner config;
# seeds key on it, so bumping this tag re-seeds the fleet and a baml merge
# never does. `latest` is refused. (required)
image = "ix/runner:2026-10-08"

# ix regions. The public API currently serves this pool in us-west-1; keep
# the list explicit so every lineage is placed in the region where the API
# accepts creates. A lineage lives in ONE region for its whole life (seed and
# forks together), so there is never a cross-region restore.
regions = ["us-west-1"]

# Global cap on concurrently existing runner machines. 32 matches the v1
# pool's concurrent-job budget: one full baml wave fits without queueing on
# the cap.                                              (default: 16)
max-runners = 32

# Idle standbys kept beyond queued demand, per lineage with demand: the
# next job of a busy lineage finds a registered runner instead of paying a
# spawn.                                                (default: 1)
headroom = 1
